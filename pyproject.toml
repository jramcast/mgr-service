[project]
name = "mgr-service"
version = "0.1.0"
description = "Music gener recognition service"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask-cors>=6.0.1",
    "gunicorn>=23.0.0",
    "joblib>=1.5.2",
    "keras>=3.0.4",
    "numpy==1.19.5",
    "requests>=2.32.5",
    "resampy>=0.4.3",
    "scikit-learn==0.24.2",
    "soundfile>=0.13.1",
    "yt-dlp>=2025.08.27",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
