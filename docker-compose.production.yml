version: '3'
services:
  ff_network:
    build: mgr/infrastructure/models/deep/feed_forward
    ports:
    - "8501:8501"
    restart: on-failure
  lstm_network:
    build: mgr/infrastructure/models/deep/lstm
    ports:
    - "8502:8501"
    restart: on-failure
  vggish:
    build: mgr/infrastructure/audioset/vggish
    ports:
    - "8503:8501"
    restart: on-failure
  server:
    build: .
    volumes:
    - "/tmp/mgr:/app/.tmp"
    ports:
    - "8000:8000"
    depends_on:
      - ff_network
      - lstm_network
      - vggish
    restart: always

  # For HTTPs serving
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Your Caddyfile in the project directory
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistent certs/config
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  caddy_data:
  caddy_config:
